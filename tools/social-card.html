<!doctype html>
<!--
  The 1200 x 630 picture shown when molecules.fyi is shared (social.png).
  It puts the serotonin picture (icon-source.png) beside the name. To remake
  it, serve the repo and run from its root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --user-data-dir="$(mktemp -d)" --hide-scrollbars --window-size=1200,720 \
    --force-device-scale-factor=1 --virtual-time-budget=5000 \
    --screenshot=social-raw.png http://localhost:8643/tools/social-card.html

  Headless Chrome's page is shorter than its window, so the window is taller
  than the picture. Crop the top 1200 x 630 into social.png.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>molecules.fyi social card</title>
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1e232a;
      /* Matches the picture's own background, top to bottom. */
      background: linear-gradient(#eaecf1, #e1e4ea);
    }
    .text {
      position: absolute;
      left: 72px;
      top: 0;
      bottom: 0;
      width: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 { margin: 0; font-size: 80px; letter-spacing: -0.02em; }
    .lead { margin: 14px 0 28px; font-size: 42px; font-weight: 600; color: #333b46; }
    .small { font-size: 26px; line-height: 1.4; color: #5b6573; }
    img {
      position: absolute;
      right: 0;
      top: 0;
      width: 630px;
      height: 630px;
      object-fit: cover;
      object-position: 38% 50%;
      -webkit-mask-image: linear-gradient(to right, transparent, black 16px);
      mask-image: linear-gradient(to right, transparent, black 16px);
    }
  </style>
</head>
<body>
  <div class="text">
    <h1>molecules.fyi</h1>
    <div class="lead">Build molecules in 3D</div>
    <div class="small">A free ball-and-stick model kit<br>for school chemistry, in your browser</div>
  </div>
  <img src="icon-source.png" alt="">
</body>
</html>
