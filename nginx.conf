server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The page, scripts and styles: browsers may keep a copy but must check for
  # a newer one each visit. Unchanged files get a quick "304 Not Modified".
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # three.js only changes when the vendor folder is replaced, so it can be
  # kept for a week. (Give a new three.js version a new folder name.)
  location /vendor/ {
    add_header Cache-Control "public, max-age=604800" always;
  }
}
